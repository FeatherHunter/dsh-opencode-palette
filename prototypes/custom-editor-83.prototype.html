<!doctype html>
<!-- PROTOTYPE-83 ★最高权威★：自定义主题配色新功能的唯一真相源（2026-10-16 用户亲定）。
     任何实现与本文冲突时，以本文为准。抛弃式原型，不进生产。归属 #83（map #82）。双击即开，内存态，不写盘。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自定义主题配色（试色草稿）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ease:cubic-bezier(0.22,1,0.36,1)}
body{background:#0B0B0D;color:#E7E7EA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:22px 22px 90px;line-height:1.55}
h1{font-size:19px;margin:2px 0 8px}
.proto-flag{display:inline-block;font-size:11px;background:#3A2A12;color:#F5A742;border:1px solid #F5A74255;border-radius:4px;padding:1px 8px;margin-bottom:8px;letter-spacing:.04em}
.intro{max-width:1120px;color:#A9A9B3;font-size:13px;background:#121216;border:1px solid #26262C;border-radius:10px;padding:12px 14px;margin:10px 0 16px}
.intro b{color:#FAB283}.intro code{color:#7FD88F;font-family:Consolas,monospace}
.state{background:#101014;border:1px solid #2A2A31;border-radius:10px;padding:12px 14px;max-width:1120px;margin-bottom:14px}
.state h2{font-size:13px;color:#FAB283;margin-bottom:8px}
.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;font-size:12px}
.state-grid .cell{background:#16161B;border:1px solid #26262C;border-radius:8px;padding:8px 10px}
.state-grid .k{color:#8B8B95;font-size:11px;margin-bottom:2px}
.state-grid .v{font-family:Consolas,monospace;word-break:break-all}
#lastChange{margin-top:8px;font-size:12px;color:#7FD88F}
.free{background:#101014;border:1px solid #2A2A31;border-radius:10px;padding:12px 14px;max-width:1120px;margin-bottom:14px}
.free h2{font-size:13px;color:#FAB283;margin-bottom:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
/* —— 全局可交互动效（第一性原理：hover 微抬升+描边提亮+柔光；active 回弹；统一 ease 150ms；reduced-motion 降级） —— */
button[data-pi]{font-family:inherit;cursor:pointer;transition:transform 150ms var(--ease),box-shadow 150ms var(--ease),background-color 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease)}
button[data-pi]:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 1px rgba(250,178,131,.35)}
button[data-pi]:active{transform:translateY(0) scale(.98);box-shadow:none}
button[data-pi]:focus-visible{outline:2px solid #FAB283;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
button[data-pi]{transition:background-color 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease)}
button[data-pi]:hover,button[data-pi]:active{transform:none;box-shadow:none}
}
body.rm button[data-pi]{transition:background-color 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease)}
body.rm button[data-pi]:hover,body.rm button[data-pi]:active{transform:none;box-shadow:none}
body.rm .hl{animation:none !important}
.abtn{background:#1C1C21;border:1px solid #33333A;color:#E7E7EA;border-radius:7px;padding:6px 12px;font-size:12px}
.abtn:hover{background:#232329;border-color:#4A4A55}
.txt:focus{outline:none;border-color:#FAB283;box-shadow:0 0 0 2px rgba(250,178,131,.4)}
button[data-pi]:focus-visible{outline:2px solid #FAB283;outline-offset:1px}
.abtn.primary{background:#FAB283;border-color:#FAB283;color:#141414;font-weight:700}
.abtn.danger{background:#2A1418;border-color:#C53B53;color:#F08A97}
.abtn.ghost{background:transparent}
/* —— 面板 mock —— */
.panel{background:#101014;border:1px solid #27272A;border-radius:12px;padding:16px 18px;max-width:1120px;margin-bottom:18px}
.panel h2{font-size:14px;margin-bottom:2px}
.panel .sub{font-size:12px;color:#A9A9B3;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #26262C}
.groupline{display:flex;align-items:center;gap:8px;font-size:12px;color:#9D7CD8;margin:16px 0 10px}
.groupline .dot{flex:none;align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:7px;border:1px solid #555;padding:4px 10px 4px 6px;font-size:12px;font-family:"JetBrains Mono",Consolas,monospace;background:#0A0A0A;color:#EEE}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chip.sel{border-width:2px;margin:-1px}
.chip .tick{font-style:normal;font-weight:700}
.op-chip{background:#FAB283;border:1px solid #FAB283;color:#141419;font-weight:700}
.op-chip:hover{background:#FFC79A;border-color:#FFC79A}
.rsec{display:flex;align-items:center;gap:8px;font-size:11px;color:#A9A9B3;letter-spacing:.08em;margin-bottom:8px}
.rsec .rcount{color:#8B8B95;font-size:11px;letter-spacing:0}
.rsearch{width:100%;max-width:380px;background:#1C1C21;border:1px solid #33333A;border-radius:6px;padding:7px 12px;font-size:13px;outline:none;color:#E7E7EA;margin-bottom:4px;box-sizing:border-box}
.rgroup{margin-bottom:10px}
.rghead{display:flex;align-items:center;gap:7px;font-size:12px;color:#A9A9B3;margin-bottom:6px}
.rghead .rcount{font-size:11px;color:#A9A9B3}
.rwrap{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px 3px 5px;font-size:11px;cursor:pointer;font-family:Consolas,Menlo,monospace;border:1px solid #555}
.rchip.sel{border-width:2px;margin:-1px}
.rchip .tick{font-style:normal;font-weight:700}
.rchip .dot{flex:none}
.rchip:focus-visible{outline:2px solid #FAB283}
.custom-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap;position:relative;border-top:1px solid #26262C;padding-top:14px}
.copytoast{position:absolute;right:0;bottom:calc(100% + 6px);background:#232329;border:1px solid #3A3A44;color:#E7E7EA;border-radius:6px;padding:4px 10px;font-size:12px;display:none;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5;white-space:nowrap}
.copytoast.show{display:inline-flex}
.custom-head .t{font-size:12px;color:#FAB283}
.copybtn{background:#1C1C21;border:1px solid #33333A;color:#C8C8D0;border-radius:6px;padding:4px 10px;font-size:12px}
.copybtn:hover{background:#232329;border-color:#55555F}
/* —— 编辑弹窗 —— */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:safe center;justify-content:safe center;z-index:40;padding:18px;overflow:auto}
.dlg{margin:auto;flex:none;background:#141419;border:1px solid #33333A;border-radius:12px;max-height:95vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-top{padding:10px 16px;border-bottom:1px solid #26262C;display:flex;flex-direction:column;gap:8px}
.dlg-top .row1{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;overflow:visible}
.row1 .abtn,.row1 .seg{flex:none}
.mode-tag{font-size:16px;font-weight:700;color:#E7E7EA;background:none;padding:0;margin-right:2px;white-space:nowrap;flex:none}
.edtag{font-size:13px;font-weight:700;border-radius:6px;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px;max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.row1 .abtn,.row1 select.txt,.row1 #f-name{height:32px}
.row1 .abtn{display:inline-flex;align-items:center}
.row1 .edtag{height:32px}
.txt{background:#1C1C21;border:1px solid #33333A;color:#E7E7EA;border-radius:6px;padding:6px 10px;font-size:12px;min-width:170px}
#f-name{flex:1;min-width:0;width:100%}
.name-wrap{position:relative;flex:1 1 auto;min-width:0;display:flex}
.name-req{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#FF6B6B;border:1px solid #FF5252;border-radius:4px;padding:0 6px;pointer-events:none;background:#1C1C21;white-space:nowrap}
#f-name.name-empty{border-color:#FF5252;box-shadow:0 0 0 1px #FF5252}
.abtn.primary:disabled{opacity:.45;cursor:not-allowed}
select.txt{max-width:230px}
.seg{display:inline-flex;background:transparent;border:0;padding:0;gap:6px;align-items:center}
.seg button{border:1px solid;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;height:32px;padding:0 14px;border-radius:7px;font-weight:400}
.seg button.seg-dark{background:#0B0B0E;border-color:#3A3A44;color:#EDEDEF}
.seg button.seg-light{background:rgba(244,244,245,.94);border-color:#77777F;color:#141417}
.seg button.seg-system{background:linear-gradient(to bottom right,#0B0B0E 0,#0B0B0E 50%,#F4F4F5 50%,#F4F4F5 100%);border-color:#55555F}
.seg button.seg-system .syslabel{color:#F0F0F0}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.seg button.seg-system .syslabel{background:linear-gradient(to bottom right,#F4F4F5 0,#F4F4F5 50%,#0B0B0E 50%,#0B0B0E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}}
.seg button.on{box-shadow:inset 0 0 0 2px #FAB283;font-weight:700}
.rleft{display:flex;align-items:center;gap:8px;flex:none;min-width:0;flex-wrap:nowrap;overflow:visible}
.rright{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:nowrap;flex:none}
#f-target{flex:0 1 150px;min-width:0;max-width:170px}
.pp-scroll{max-height:280px;overflow:auto;background:#1C1C21;border:1px solid #33333A;border-radius:8px;padding:8px 10px}
.pp-group{margin-bottom:10px}
.pp-group:last-child{margin-bottom:0}
.basechip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 8px 1px 5px;font-size:11px;margin-left:6px;white-space:nowrap}
.basechip .dot{flex:none}
.basechip.none{border:1px dashed #55555F;color:#8B8B95;background:transparent;padding:1px 8px}
.toolbar{display:flex;gap:14px;align-items:center;font-size:12px;color:#A9A9B3;margin-bottom:14px;max-width:1120px}
.toolbar span{color:#8B8B95}
.toolbar label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
#rmToggle{accent-color:#FAB283;width:14px;height:14px;margin:0}
.chip svg,.abtn svg,.seg button svg,.copybtn svg{vertical-align:-2px}
.dlg-body{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:0;min-height:0;flex:1;overflow:hidden}
.dlg-left{overflow-y:auto;overflow-x:hidden;padding:10px 4px;border-right:1px solid #26262C;min-width:0}
.dlg-right{overflow:auto;padding:12px 14px;background:#0D0D10;min-width:0}
.dlg-right.host-light{background:#E2E2E6}
.gtitle{font-size:12px;color:#9D7CD8;margin:10px 0 6px}
.tflag{font-size:10px;color:#7FD88F;border:1px solid #3D9A57;border-radius:4px;padding:0 6px;margin-left:6px}
.gtitle:first-child{margin-top:0}
.crow{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;padding:5px 4px;border:1px solid transparent;border-radius:8px;cursor:default;position:relative}
.crow .nm,.mini,.badges{cursor:default}
.sw,.tbtn{cursor:pointer}
.abtn,.tbtn,.chip,.pill,.pbtn,.hex,.seg button,.tflag{white-space:nowrap}
.tbtn,.hex{flex:none}
.crow:hover{background:#1A1A20;border-color:#2A2A31}
.crow.target{border-color:#FAB283;background:#1E1A14}
.crow .nm{flex:0 1 auto;min-width:0}
.crow .nm b{display:inline-block;max-width:100%;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.crow .nm small{display:block;font-size:11px;color:#A0A0A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:30px;height:22px;border-radius:6px;border:1px solid #00000066;flex:none;padding:0}
.hex{font-family:Consolas,monospace;font-size:11px;color:#C8C8D0;min-width:0;flex:none}
.tbtn{font-size:11px;background:transparent;border:1px solid #3A3A44;color:#A9A9B3;border-radius:5px;padding:2px 8px;flex:none}
.dlg-left,.dlg-right,.pp-scroll{scrollbar-width:thin;scrollbar-color:#3A3A44 transparent}
.dlg-left::-webkit-scrollbar,.dlg-right::-webkit-scrollbar,.pp-scroll::-webkit-scrollbar{width:10px;height:10px}
.dlg-left::-webkit-scrollbar-thumb,.dlg-right::-webkit-scrollbar-thumb,.pp-scroll::-webkit-scrollbar-thumb{background:#3A3A44;background-clip:padding-box;border:2px solid transparent;border-radius:8px}
.dlg-left::-webkit-scrollbar-thumb:hover,.dlg-right::-webkit-scrollbar-thumb:hover,.pp-scroll::-webkit-scrollbar-thumb:hover{background:#4A4A55;background-clip:padding-box;border:2px solid transparent}
.dlg-left::-webkit-scrollbar-track,.dlg-right::-webkit-scrollbar-track,.pp-scroll::-webkit-scrollbar-track{background:transparent}
#capPrevTop{display:inline-flex;align-items:center;flex:none}
.dlg-left{scrollbar-color:transparent transparent}
.dlg-left:hover{scrollbar-color:#3A3A44 transparent}
.dlg-left::-webkit-scrollbar-thumb{background:transparent;border:2px solid transparent;border-radius:8px}
.dlg-left:hover::-webkit-scrollbar-thumb{background:#3A3A44;background-clip:padding-box;border:2px solid transparent;border-radius:8px}
.dlg-right{scrollbar-width:none}
.dlg-right::-webkit-scrollbar{display:none;width:0 !important;height:0 !important}
/* 微缩 DSH 画布 */
.mini{border:1px solid #33333A;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:max-content minmax(0,1fr);min-height:540px;min-width:0}
.mini.inv{border-color:#D8D8DE}
.side{padding:10px;display:flex;flex-direction:column;gap:6px}
.sess{border-radius:6px;padding:6px 8px;font-size:11px;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.sess.cur{position:relative}
.sess .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px}
.main{padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bubble{align-self:flex-end;border-radius:10px;padding:8px 12px;font-size:12px;max-width:85%;word-break:keep-all}
.md{border-radius:8px;padding:10px 12px;font-size:12px}
.md h4{font-size:14px;margin-bottom:4px}
.md hr{margin:8px 0;border:0;border-top:1px solid}
.tip{display:inline-block;font-size:11px;border-radius:20px;padding:2px 10px;margin-top:6px}
.codecard{border-radius:8px;overflow:hidden;border:1px solid}
.codehead{display:flex;justify-content:space-between;padding:5px 10px;font-size:11px}
.codepre{padding:8px 10px;font-family:Consolas,monospace;font-size:11px;overflow:auto;white-space:pre}
.diffcard{border-radius:8px;overflow:hidden;border:1px solid;font-size:11px;font-family:Consolas,monospace}
.drow{display:grid;grid-template-columns:34px 1fr}
.drow .ln{padding:4px 6px;text-align:right}
.drow .tx{padding:4px 8px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.codecard,.diffcard,.md,.bubble,.cinput{min-width:0}
.pill{border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;line-height:1.2}
.btnrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbtn{border-radius:7px;padding:5px 16px;font-size:12px;font-weight:700;border:1px solid;line-height:1.2}
.cinput{border-radius:8px;padding:8px 12px;font-size:12px;border:1px solid}
.hl{box-shadow:inset 0 0 0 2px #FAB283 !important;animation:breath 1.1s ease-in-out infinite;position:relative}
@keyframes breath{0%,100%{box-shadow:inset 0 0 0 2px #FAB283,0 0 0 0 rgba(250,178,131,.55)}50%{box-shadow:inset 0 0 0 2px #FAB283,0 0 0 6px rgba(250,178,131,0)}}
.hl-edge{box-shadow:0 0 0 2px #FAB283 !important;animation:breathEdge 1.1s ease-in-out infinite;position:relative}
@keyframes breathEdge{0%,100%{box-shadow:0 0 0 2px #FAB283,0 0 0 0 rgba(250,178,131,.55)}50%{box-shadow:0 0 0 2px #FAB283,0 0 0 6px rgba(250,178,131,0)}}
.slotbadge{position:absolute;top:-9px;right:-6px;font-size:10px;background:#FAB283;color:#141414;border-radius:4px;padding:0 6px;font-family:Consolas,monospace;z-index:3}
/* popover */
.popconfirm{position:absolute;top:calc(100% + 8px);right:0;z-index:70;width:max-content;max-width:min(300px,86vw);background:#232329;border:1px solid #4A4A55;border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px}
.popconfirm b{font-size:12px;color:#F0F0F0}
.popconfirm small{font-size:11px;color:#A9A9B3}
.popconfirm .pc-row{display:flex;gap:8px;margin-top:6px}
.pop{position:fixed;z-index:60;width:250px;background:#1B1B21;border:1px solid #3D3D47;border-radius:10px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.pop h4{font-size:12px;margin-bottom:8px}
.sv{width:100%;height:120px;border-radius:8px;position:relative;cursor:crosshair;border:1px solid #00000088;margin-bottom:8px}
.sv .mk{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;transform:translate(-6px,-6px);pointer-events:none}
.hue{width:100%;margin:4px 0 8px}
.freq{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.freq button{width:24px;height:18px;border-radius:4px;border:1px solid #00000077;padding:0}
.pop .prow{display:flex;gap:6px;align-items:center;margin-top:6px}
.err{color:#F08A97;font-size:12px}
</style>
</head>
