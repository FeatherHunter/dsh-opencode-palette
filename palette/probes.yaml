# =============================================================================
# palette/probes.yaml —— 探测原语
# role: 探测（能力生效前先问宿主「这个还行吗」）
# generated: false
# validate: python scripts/research/palette-check.py（npm/CI 接入属实现期）
#
# 能力条目里的 when.probe 只能引用这里登记的原语；
# 代码实现也只实现这些原语（数据驱动，不写自由逻辑）。
# =============================================================================
api: 3

# -----------------------------------------------------------------------------
# 1. 探测原语
# -----------------------------------------------------------------------------
primitives:
  selector_exists:
    label: 锚点存在
    kind: dom
    eval: selector_match
    args: [anchor]
    description: 在当前页面里能否匹配到锚点；匹配不到则该锚点相关写入降级。

  token_live:
    label: token 活着
    kind: host
    eval: token_status_live
    args: [name]
    description: 该宿主 token 有消费方（status=live），写它才会生效。

  token_declared:
    label: token 已声明
    kind: host
    eval: token_declared
    args: [name]
    description: 该 token 在宿主样式里声明过（哪怕没有消费方）；用于区分「拼错」与「死名」。

# -----------------------------------------------------------------------------
# 2. 探测环境（同一份能力在不同环境下的判定结果可以不同）
#    live     = 真实运行页面（最终事实）
#    preview  = 编辑器里的预览区（构造的近似环境）
#    fixture  = 测试用固定 DOM（单元测试 / 门禁）
# -----------------------------------------------------------------------------
profiles:
  live:    { description: 真实页面，用真实 DOM 与计算样式 }
  preview: { description: 预览区，构造近似 DOM，允许部分原语返回 unknown }
  fixture: { description: 测试夹具，结果必须确定，用于 CI }

# -----------------------------------------------------------------------------
# 3. 探测结果语义
# -----------------------------------------------------------------------------
results:
  supported:   { description: 探测通过，可以写入 }
  unsupported: { description: 探测失败，走下一档降级效果 }
  unknown:     { description: 预览环境无法判定，按 supported 处理但标「未验证」 }

