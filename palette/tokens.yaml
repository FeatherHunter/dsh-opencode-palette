# -----------------------------------------------------------------------------
# 2. 状态模型（主状态互斥 + 修饰标签可叠加）
# -----------------------------------------------------------------------------
status_model:
  primary_status:                # 三选一、互斥；颜色轴 184 + 38 + 0 = 222 恰好分完
    live:      有消费方，写它生效
    dead:      宿主声明了但没有任何 var() 消费方
    missing:   宿主从未声明这个名字（用户可能拼错或宿主升级改名）
  modifiers:                     # 可叠加在 primary 上（尤其 live），不另计基数
    pinned:            宿主用 !important 规则钉住，普通规则压不过
    gated:             由运行时消费（JS 读取），不是 CSS var() 能判断
    declared_invalid:  声明了但消费方式特殊（如依赖 fallback / 由 JS 注入）
# 见 palette/SPEC.md §6；修饰标签不增加颜色轴计数（不得再对 184+38 加修饰数）

