# generated: partial（当前 15 条手工核实样本；完整 425 由扫描器生成后替换）
# command: palette:scan-tokens（扫描器规划中，当前为手工样本）
# validate: python scripts/research/palette-check.py（npm/CI 接入属实现期）
#
# 生成策略：扫描器产出完整表后整表替换，人工不补全表；当前 partial 阶段的 15 条
# 样本为人工核实值，扫描器就位后由生成物覆盖（手改会在 CI 被检测并报告）。
# 数据来源：D:\Temp\dsh-src @ 687f282（dsh 0.2.1-rc.2）与 Playwright 首屏实测。
# declared 路径约定：仓库根相对路径（packages/… 或 apps/…，可带 :行号）；基准目录 = host.source。
# 当前版本 = 骨架 + 15 条已核实样本（主状态：14 live + 1 dead；修饰标签：1 gated，
# 落在 --dsw-elevation-panel；missing 与 pinned / declared_invalid 修饰仅有词表定义，
# 样本待扫描器补齐；命名空间覆盖 3 个）。
# 完整 425 名由扫描器批量填充。注意：本文件 api:1 是「宿主事实表自身版本」，
# 与主题 schema 的 api:3 无关（两个独立版本轴）。
# =============================================================================
