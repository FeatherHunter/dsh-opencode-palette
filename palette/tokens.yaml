# -----------------------------------------------------------------------------
# 2. 状态模型（主状态互斥 + 修饰标签可叠加）
# -----------------------------------------------------------------------------
status_model:
  primary_status:                # 三选一、互斥；颜色轴 184 + 38 + 0 = 222 恰好分完
    live:      有消费方，写它生效
    dead:      宿主声明了但没有任何 var() 消费方
    missing:   宿主从未声明这个名字（用户可能拼错或宿主升级改名）
  modifiers:                     # 可叠加在 primary 上（尤其 live），不另计基数
    pinned:            宿主用字面量 / !important / inline 钉住；我们照常写入但当前被压制、不生效（仍允许设置，只提示，不阻止不删除）
    gated:             宿主在元素级重声明同名变量（elevation 族等）；body 级写入被子元素覆盖，需区域级选择器
    declared_invalid:  宿主自己声明了但消费链无效（声明位置与读取位置不一致，靠 fallback / JS 注入才有值）
# 见 palette/SPEC.md §6；修饰标签不增加颜色轴计数（不得再对 184+38 加修饰数）。
# 注意：由 JS / shiki 运行时读取计算值消费、CSS var() 静态扫描看不见的 token，主状态按「有运行时消费方」仍记 live；
#       这是探测口径盲区，不是 gated。gated 只指「元素级重声明」这一种机制。

