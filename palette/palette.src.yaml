# palette.src.yaml —— 手写能力源（能力菜单的手写部分，唯一人工维护入口）
# 说明：palette/palette.yaml 由 scripts/research/gen_palette_v5.py 生成（手写条目 + 生成条目），不要手改 palette.yaml。
# 改能力请改本文件，然后重跑生成器与 scripts/research/palette-check.py。

api: 3
palette_version: 3.0.0
title: DSH 全量主题能力表
description: '插件的唯一能力真源。用户主题只能写这里登记过的能力 id；

  宿主改名时，只改 tokens.yaml / anchors.yaml，本文件不动。

  '
control_templates:
  button:
    properties:
    - icon
    - background
    - foreground
    - border_color
    - radius
    - opacity
    - shadow
  item:
    properties:
    - background
    - foreground
    - border_color
    - radius
  text:
    properties:
    - foreground
    - font_family
    - font_size
    - line_height
    - font_weight
  surface:
    properties:
    - background
    - border_color
    - radius
    - shadow
capabilities:
  global.page.background:
    kind: property
    since: 3.0.0
    tier: basic
    tags:
    - surface
    - global
    - media
    value: media
    docs: '页面整体背景。纯色走宿主 token；渐变/图画成规则；视频插媒体层。

      第 8–11 条需求的通用实现：区域背景（静态图 / 动态图 / 视频）。

      '
    examples:
    - value:
        light: '#f7f3ea'
        dark: '#12100c'
    - value: 'linear-gradient(180deg, #fdf6e3, #f5e6c8)'
    - value: assets/bg.jpg
    - value: assets/bg.mp4
    realization:
    - id: prefer-token
      accepts: color
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-alias-bg-base
    - id: css-paint
      accepts: paint
      writes:
      - id: bg
        use: rule
        anchor: global.root
        layer: base
        decl:
          background: $value
          background-size: cover
          background-position: center
    - id: media-layer
      accepts: video
      writes:
      - id: media
        use: dom
        anchor: global.root
        op: insert-media-layer
        payload: $value
        params:
          position: fixed
          inset: '0'
          z: -1
          fit: cover
          loop: true
          muted: true
          autoplay: true
          reduced_motion: static_poster
          pointer_events: none
        teardown: remove-node
        guard: observer
    meta:
      evidence:
      - packages/client/ui-theme/src/client/index.ts:369-378
  global.text.foreground:
    kind: property
    since: 3.0.0
    tier: basic
    tags:
    - text
    - global
    value: color
    realization:
    - id: token
      writes:
      - id: token
        use: token
        name: --dsw-alias-label-primary
  global.text.font_family:
    kind: property
    since: 3.0.0
    tier: advanced
    tags:
    - typography
    - font
    value: typeface
    docs: '第 1 条需求：英文用英文字体、中文用中文字体。给 font_set（书写系统 → 字体）

      时自动生成 @font-face + unicode-range，同一段混排也能逐字分派；

      给字体栈则整体应用。

      '
    examples:
    - value: '"LXGW WenKai", "Noto Sans SC", sans-serif'
    - value:
        latin: assets/Font-Latin.woff2
        han: assets/Font-CJK.woff2
    realization:
    - id: token-stack
      accepts: font_stack
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-font-family
        value_template: $value
    - id: font-set-faces
      accepts: font_set
      atomic: true
      repeat:
        over: $value
        as: entry
      writes:
      - id: face-$entry.key
        use: rule
        at: '@font-face'
        layer: base
        decl:
          font-family: Palette-$entry.key
          src: url($entry.value) format("woff2")
          unicode-range: $entry.range
      - id: apply
        use: rule
        anchor: global.root
        layer: base
        decl:
          font-family: $family_stack
