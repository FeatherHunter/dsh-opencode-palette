api: 3
palette_version: 3.0.0
implementation: scaffold
requires:
  capabilities: '>=3.0.0'
  vocabulary: '>=3.0.0'
  values: '>=3.0.0'
  primitives: '>=3.0.0'
  assets: '>=3.0.0'
  probes: '>=3.0.0'
modules:
  capabilities:
    file: capabilities.yaml
    version: 3.0.0
    generated: false
    kind: capabilities_source
    summary: 手写能力源——28 条手写能力 + 控件模板 + api/palette_version；改能力改这里
  palette:
    file: palette.yaml
    version: 3.0.0
    generated: true
    kind: composed
    command: python scripts/research/gen_palette_v5.py（由全部底层模块合成；勿手改）
    summary: 能力全集合成视图——词表/值类型/原语/资源/探测/锚点 + 能力菜单 331 + 直绑定 425 + runtime 摘要
  vocabulary:
    file: vocabulary.yaml
    version: 3.0.0
    generated: false
    kind: vocabulary
    summary: 词表——区域/角色/属性/recipe/状态/语言/目录
  values:
    file: values.yaml
    version: 3.0.0
    generated: false
    kind: value_types
    summary: 值类型系统、语言与 Unicode 范围、主题变量语法
  primitives:
    file: primitives.yaml
    version: 3.0.0
    generated: false
    kind: write_primitives
    summary: 写原语——token / rule / dom / host_api 的字段、参数、撤销与冲突策略
  assets:
    file: assets.yaml
    version: 3.0.0
    generated: false
    kind: assets
    summary: 资源类型与安全策略——图片/动态图/视频/字体/图标
  probes:
    file: probes.yaml
    version: 3.0.0
    generated: false
    kind: probes
    summary: 探测原语与探测环境——能力生效前先问宿主「这个还行吗」
  tokens:
    file: tokens.yaml
    version: dsh 0.2.1-rc.3 @ 1f81c04（rc.3 主题面与 rc.2 逐字节相同）
    generated: full
    kind: host_facts
    command: python scripts/research/gen_token_registry.py（扫描器已实现，全量 425 条）
    summary: 宿主 token 全集 425 条：状态（live/dead + 修饰）、声明位置（全部）、消费次数、消费位置（全部）、本仓是否已注入；扫描器生成，勿手改
  anchors:
    file: anchors.yaml
    version: dsh 0.2.1-rc.2 @ 687f282
    generated: partial
    kind: host_facts
    command: palette:scan-anchors（扫描器规划中；当前 anchors.yaml 为人工清单）
    reviewed: true
    summary: DOM 锚点候选与控件清单（宿主私有选择器集中地）
