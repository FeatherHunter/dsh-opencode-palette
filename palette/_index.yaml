# =============================================================================
# palette/_index.yaml —— 模块注册表（唯一入口）
# role: 注册表
# generated: false
# validate: python scripts/research/palette-check.py（npm/CI 接入属实现期）
#
# 新 session / 新 AI 先读本文件。它回答三件事：
#   1) 能力集由哪几部分组成、每部分在哪个文件；
#   2) 哪些文件是扫描生成的、禁止手改，改哪个命令重新生成；
#   3) 各模块版本与最低依赖版本，避免跨模块错配。
#
# 设计原则（第一性原理，详见 README.md）：
#   单一事实源 / 按技术域拆分 / 按变化频率分层 / 契约先行 / 生成与手写分离 /
#   开闭扩展（新技术 = 新文件 + 注册，不改 palette.yaml 结构）。
# =============================================================================
api: 3
palette_version: 3.0.0
implementation: scaffold       # 设计稿阶段：9 模块齐全、样本已核实；扫描器/门禁/运行时编译器尚未实现（见 SPEC.md §9）

requires:                 # 能力菜单依赖的最低模块版本，门禁校验
  vocabulary: '>=3.0.0'
  values: '>=3.0.0'
  primitives: '>=3.0.0'
  assets: '>=3.0.0'
  probes: '>=3.0.0'

modules:
  palette:
    file: palette.yaml
    version: 3.0.0
    generated: false
    kind: capabilities
    summary: 能力菜单——一行一个可配置能力（谁·哪个部件·哪个维度 + 如何落到宿主）
  vocabulary:
    file: vocabulary.yaml
    version: 3.0.0
    generated: false
    kind: vocabulary
    summary: 词表——区域/角色/属性/recipe/状态/语言/目录
  values:
    file: values.yaml
    version: 3.0.0
    generated: false
    kind: value_types
    summary: 值类型系统、语言与 Unicode 范围、主题变量语法
  primitives:
    file: primitives.yaml
    version: 3.0.0
    generated: false
    kind: write_primitives
    summary: 写原语——token / rule / dom / host_api 的字段、参数、撤销与冲突策略
  assets:
    file: assets.yaml
    version: 3.0.0
    generated: false
    kind: assets
    summary: 资源类型与安全策略——图片/动态图/视频/字体/图标
  probes:
    file: probes.yaml
    version: 3.0.0
    generated: false
    kind: probes
    summary: 探测原语与探测环境——能力生效前先问宿主「这个还行吗」
  tokens:
    file: tokens.yaml
    version: 'dsh 0.2.1-rc.2 @ 687f282'
    generated: true
    kind: host_facts
    command: palette:scan-tokens（扫描器规划中；当前 tokens.yaml 为 14 条手工核实样本）
    summary: 宿主 token 全集与活/死状态、声明行、消费方（扫描生成，禁手改）
  anchors:
    file: anchors.yaml
    version: 'dsh 0.2.1-rc.2 @ 687f282'
    generated: partial       # 锚点候选扫描生成，置信度与控件清单人工确认
    kind: host_facts
    command: palette:scan-anchors（扫描器规划中；当前 anchors.yaml 为人工清单）
    reviewed: true
    summary: DOM 锚点候选与控件清单（宿主私有选择器集中地）

# counts 由门禁从源文件重算并比对；这里只是快照
counts:
  capabilities_authored: 28     # palette.yaml 里手写的条目
  capabilities_generated: 65    # 由 control_templates × controls 展开（构建期计算）
  controls: 12
  regions: 14
  roles: 27

# 生成物与派生物（不属于源文件，按需生成）
artifacts:
  merged: palette/_merged.yaml          # 合并视图：给人/AI 通读，不参与校验
  gaps: docs/palette/coverage-gaps.md   # 宿主有、能力集没有的缺口 = 扩建待办
  matrix: docs/palette/capability-matrix.md  # 区域 × 角色 × 属性 的能力矩阵
  schema: palette/schema/palette-v3.schema.json  # 由本目录派生，供编辑器/AI 校验

