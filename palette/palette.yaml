  global.text.font_family:
    kind: property
    since: 3.0.0
    tier: advanced
    tags:
    - typography
    - font
    value: typeface
    docs: '第 1 条需求：英文用英文字体、中文用中文字体。给 font_set（书写系统 → 字体）

      时自动生成 @font-face + unicode-range，同一段混排也能逐字分派；

      给字体栈则整体应用。

      '
    examples:
    - value: '"LXGW WenKai", "Noto Sans SC", sans-serif'
    - value:
        latin: assets/Font-Latin.woff2
        han: assets/Font-CJK.woff2
    realization:
    - id: token-stack
      accepts: font_stack
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-font-family
        value_template: $value
    - id: font-set-faces
      accepts: font_set
      atomic: true
      repeat:
        over: $value
        as: entry
      writes:
      - id: face-$entry.key
        use: rule
        at: '@font-face'
        layer: base
        decl:
          font-family: Palette-$entry.key
          src: url($entry.value) format("woff2")
          unicode-range: $entry.range
      - id: apply
        use: rule
        anchor: global.root
        layer: base
        decl:
          font-family: $family_stack
    exposure: 默认开放
    source: hand-authored
