value_types:
  color:
    kind: color
    diurnal: true
    ref: true
    parse: css_color
    serialize: css_color
  gradient:
    kind: gradient
    stops:
      min: 2
      max: 4
    diurnal: true
    ref: true
    parse: css_gradient
    serialize: css_gradient
  paint:
    kind: union
    of:
    - color
    - gradient
    - image
    diurnal: true
    ref: true
    parse: css_paint
    serialize: css_paint
  length:
    kind: length
    units:
    - px
    - rem
    - em
    - '%'
    - vh
    - vw
    diurnal: false
    ref: true
    parse: css_length
    serialize: css_length
  number:
    kind: number
    min: 0
    max: 1
    step: 0.01
    diurnal: false
    ref: true
  line_height:
    kind: union
    of:
    - number
    - length
    diurnal: false
    ref: true
  font_stack:
    kind: font_stack
    diurnal: false
    ref: true
    parse: font_stack
    serialize: font_stack
  font_set:
    kind: map
    key: script
    value: font_stack
    value_asset: font
    unicode_range: builtin
    diurnal: false
    ref: true
  typeface:
    kind: union
    of:
    - font_stack
    - asset_font
    - font_set
    diurnal: false
    ref: true
  asset_font:
    kind: asset
    asset_kind: font
    diurnal: false
    ref: false
  weight:
    kind: enum
    values:
    - 100
    - 200
    - 300
    - 400
    - 500
    - 600
    - 700
    - 800
    - 900
    diurnal: false
    ref: false
  icon:
    kind: asset
    asset_kind: icon
    diurnal: false
    ref: false
  image:
    kind: asset
    asset_kind: wallpaper
    diurnal: true
    ref: false
  animated_image:
    kind: asset
    asset_kind: wallpaper
    animated: true
    diurnal: true
    ref: false
  video:
    kind: asset
    asset_kind: video
    diurnal: true
    ref: false
    poster: optional
  media:
    kind: union
    of:
    - image
    - animated_image
    - video
    diurnal: true
    ref: false
  shadow:
    kind: shadow
    diurnal: true
    ref: true
  duration:
    kind: duration
    units:
    - ms
    - s
    diurnal: false
    ref: false
  easing:
    kind: easing
    diurnal: false
    ref: false
  font:
    zh: CSS font 简写（font shorthand）
    kind: string
    css_grammar: font
    example: 14px/24px 'Noto Sans SC', sans-serif
    diurnal: true
    parse: 按 CSS font 简写语法校验（字族必须在白名单/资源内）
    note: '宿主 30 个排印复合 token 用 `font: var(--dsw-font-*)` 简写消费，写整条即可整体生效。'
  font_style:
    zh: 字体样式
    kind: enum
    values:
    - normal
    - italic
    - oblique
    diurnal: false
    note: 宿主 150 条排印长手中的 font-style 轴；多数为 dead，仅登记。
  filter:
    zh: CSS 滤镜 / 背景滤镜
    kind: string
    css_grammar: filter | backdrop-filter
    example: blur(12px) saturate(120%)
    diurnal: true
  shape:
    zh: 形状（squircle 等）
    kind: enum
    values:
    - squircle
    - round
    - bevel
    diurnal: false
    note: --dsw-corner-shape 当前无消费方；登记以便宿主日后启用。
scripts:
  latin: U+0000-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF, U+2100-214F
  greek: U+0370-03FF
  cyrillic: U+0400-04FF, U+0500-052F
  hebrew: U+0590-05FF, U+FB1D-FB4F
  arabic: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF
  devanagari: U+0900-097F
  thai: U+0E00-0E7F
  han: U+2E80-2EFF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+20000-2FA1F
  kana: U+3040-30FF, U+31F0-31FF
  hangul: U+1100-11FF, U+3130-318F, U+AC00-D7AF
variables_spec:
  pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
  max: 64
  reserved_prefix: palette
  css_var_prefix: --palette-var-
semantics:
  absent: 不注入
  null: 清除本层写入
  values_are_visual_truth: false
write_kinds:
  token:
    label: 变量注入
    status: stable
    description: '通过 host API 注册或覆盖 CSS 变量。宿主消费 var(--name) 即生效。

      本原语只服务 palette 作者（能力绑定）：名字必须在 tokens.yaml 里主状态 = live；

      允许写死名/门控名时须显式 allow_primary_status / allow_modifiers + allow_reason。

      例外（v1.10）：realization 级 `when: { probe: token_live }` 守卫的条件写——守卫已表达

      「只在该 token 活着时才写」，该守卫绑定的 token 写可不给 allow_*（详见 §1b realization schema）。

      用户层逃生舱 raw_tokens 不走本原语：名字不校验、只校验值形状（SPEC §3 硬规则 3）。

      '
    fields:
      name:
        required: true
        type: token_name
        pattern: ^--[a-z][a-z0-9-]*$
      state:
        required: false
        type: enum
        values:
        - hover
        - active
        - focus
        - disabled
        - selected
      value:
        required: false
        type: any
      value_template:
        required: false
        type: string
      allow_primary_status:
        required: false
        type: list
        values:
        - live
        - dead
        - missing
      allow_modifiers:
        required: false
        type: list
        values:
        - pinned
        - gated
        - declared_invalid
      allow_reason:
        required: false
        type: string
    validates:
    - name 必须在 tokens.yaml 存在（tokens.yaml 为完整表后；当前 15 条样本，未覆盖的名字 = 门禁错误）
    - allow_primary_status 缺省时主状态必须为 live；allow_modifiers 只放宽修饰、不改变主状态
    - 出现 allow_primary_status 或 allow_modifiers 时 allow_reason 必填
    - live 名不得给 allow_primary_status（放宽主状态只用于非 live 名）
    - tokens.yaml 表内条目名全局唯一（重名 = 门禁错误）
    - 'token_live 守卫的条件写例外（v1.10）：被 realization 级 when: { probe: token_live } 守卫、且未显式给 allow_* 的 token 写视为合法；守卫绑定该写自己的 token 名（见 §1b）'
  rule:
    label: 样式规则
    status: stable
    description: '按锚点写一条 CSS 规则。锚点来自 anchors.yaml；层叠层级用 layers 枚举；

      状态自动拼选择器后缀；语言自动包 :lang()；与宿主 inline style 冲突时才允许 !important。

      '
    fields:
      anchor:
        required: false
        type: anchor_ref
      at:
        required: false
        type: enum
        values:
        - '@font-face'
        - '@keyframes'
        - '@property'
      layer:
        required: true
        type: enum
        ref: layers
      state:
        required: false
        type: enum
        ref: states
      lang:
        required: false
        type: language_tag
      decl:
        required: true
        type: map
        key: css_property
        value: string
      important:
        required: false
        type: enum
        values:
        - never
        - when_inline_conflict
        - always
        default: never
      media:
        required: false
        type: string
    validates:
    - anchor 与 at 必须且只能给一个
    - decl 的值必须经过 parse → serialize，禁止原文拼接
    - important=always 需要 allow_reason
    policies:
      important_default: never
      important_when_inline_conflict: true
      allowed_css_properties:
      - background
      - background-color
      - background-image
      - background-size
      - background-position
      - color
      - font-family
      - font-size
      - line-height
      - font-weight
      - letter-spacing
      - border-color
      - border-width
      - border-style
      - border-radius
      - box-shadow
      - opacity
      - filter
      - backdrop-filter
      - -webkit-backdrop-filter
      - mask-image
      - mask-size
      - mask-repeat
      - mask-position
      - outline-color
      - outline-width
      - outline-style
      - text-decoration-color
      - caret-color
      - scrollbar-color
      - scrollbar-width
      - transition
      - transform
      allowed_at_descriptors:
        '@font-face':
        - font-family
        - src
        - font-weight
        - font-style
        - font-display
        - unicode-range
        '@keyframes':
        - '*'
        '@property':
        - syntax
        - inherits
        - initial-value
  dom:
    label: DOM 操作
    status: stable
    description: 'CSS 表达不了的效果（视频背景、换图标、插图层）用 DOM 操作。

      每个写必须有稳定 id 和 teardown（切主题/关插件时精确撤销），

      对 React 渲染的节点必须配 guard: observer（重渲染后幂等重放）。

      '
    fields:
      anchor:
        required: true
        type: anchor_ref
      op:
        required: true
        type: enum
        ref: dom_ops
      payload:
        required: false
        type: any
      params:
        required: false
        type: map
      teardown:
        required: true
        type: enum
        ref: teardowns
      guard:
        required: false
        type: enum
        values:
        - none
        - observer
        default: none
    dom_ops:
      insert-layer:
        description: 在锚点内插入纯样式层（图/渐变/颜色），不接收事件
        payload:
        - paint
        - image
        - animated_image
        params:
          position:
            type: enum
            values:
            - fixed
            - absolute
            default: fixed
          inset:
            type: string
            default: '0'
          z:
            type: number
            default: -1
          fit:
            type: enum
            values:
            - cover
            - contain
            - repeat
            default: cover
          pointer_events:
            type: enum
            values:
            - none
            default: none
      insert-media-layer:
        description: 在锚点内插入媒体层（图 / 动态图 / 视频），视频需 <video>
        payload:
        - image
        - animated_image
        - video
        params:
          position:
            type: enum
            values:
            - fixed
            - absolute
            default: absolute
          inset:
            type: string
            default: '0'
          z:
            type: number
            default: 0
          fit:
            type: enum
            values:
            - cover
            - contain
            - repeat
            default: cover
          loop:
            type: boolean
            default: true
          muted:
            type: boolean
            default: true
          autoplay:
            type: boolean
            default: true
          poster:
            type: boolean
            default: true
          playback_rate:
            type: number
            default: 1
          reduced_motion:
            type: enum
            values:
            - pause
            - static_poster
            default: static_poster
          pointer_events:
            type: enum
            values:
            - none
            default: none
      replace-children:
        description: 替换锚点子节点（换图标/头像）；必须能恢复原节点
        payload:
        - icon
        - image
        - svg
        params:
          keep_size:
            type: boolean
            default: true
          keep_color:
            type: boolean
            default: false
      set-attribute:
        description: 改锚点属性（aria-label 等）；谨慎，仅白名单属性
        payload:
        - string
        params:
          attribute:
            type: enum
            values:
            - aria-label
            - title
    teardowns:
    - remove-node
    - restore-children
    - restore-attribute
    guards:
    - none
    - observer
    policies:
      write_modes:
        mask: null
        replace: null
        overlay: null
      dom_write_order:
      - insert-layer
      - insert-media-layer
      - replace-children
      - set-attribute
  host_api:
    label: 宿主接口
    status: reserved
    description: '未来宿主开放「样式插件 API / 窗口控件 API」时使用。

      注意：桌面标题栏当前走 token（宿主探针读 --dsw-specific-sidebar-fill 与

      --dsw-alias-label-primary 后调 setTitleBarOverlay），不需要 host_api。

      '
    fields:
      api:
        required: true
        type: string
      params:
        required: false
        type: map
      teardown:
        required: true
        type: enum
        ref: teardowns
realization:
  description: '一个能力（capability）由若干 realization 组成，按声明顺序取第一条「探测通过」的；

    recipe 的每个 aspect 各自独立降级。realization 级 when 是整条效果链的前置探测。

    '
  fields:
    id:
      required: true
      type: string
    accepts:
      required: false
      type: value_type_ref
    when:
      required: false
      type: guard
    writes:
      required: true
      type: list
      item: write
  guard:
    probe:
      required: true
      type: string
      ref: probes.primitives
    args:
      required: false
      type: map
  validates:
  - when.probe 必须引用 probes.yaml 已登记的原语；args 的键必须是该原语声明的参数
  - token_live 守卫的绑定：显式给 args.name 时，该 realization 内每个 token 写的 name 必须与之一致；省略 args.name 时逐写绑定各自 token 名（每条 token 写只在自己那个 token 活着时执行）
  - 守卫只对 token 写生效；realization 内其余写（rule/dom）照常执行，除非另有 when
  - 无守卫的 token 写必须遵守 write_kinds.token.validates 的 allow_* 规则
policies:
  layers:
  - tokens
  - base
  - component
  - state
  - override
  layer_order_statement: 'tokens   = 变量层（最先写）

    base     = 元素基础样式

    component= 组件级覆盖

    state    = 状态规则（hover/active/focus/disabled/selected）

    override = 需要压过宿主时的最后一层

    '
  write_order:
  - token
  - rule
  - dom
  atomic: '一个效果的多个写要么全部成功，要么全部回滚；

    recipe 的各 aspect 互相独立，单 aspect 失败只降级该 aspect。

    '
  idempotent: 同一能力重复应用结果一致；切换主题按写 id 求差集撤销。
  diagnostics: '每个写最终状态必须是：applied / degraded / suppressed / failed 之一，

    并带原因（如「锚点不存在」「token 为死名」「被宿主 !important 压制」）。

    '
assets_policy:
  uri: relative_only
  external: forbidden
  data_url: forbidden
  max_total_bytes: 33554432
  max_files: 64
  path_rules:
  - 禁止 '..' 越界
  - 禁止绝对路径与盘符
  - 扩展名白名单见 kinds
assets_kinds:
  wallpaper:
    media:
    - jpg
    - jpeg
    - png
    - webp
    - avif
    - gif
    animated_media:
    - gif
    - webp
    - avif
    - apng
    max_bytes: 8388608
    diurnal: true
    description: 背景图；动态图（GIF/WebP/AVIF/APNG）可直接当 CSS 背景，浏览器自动播放。
  icon:
    media:
    - svg
    - png
    - webp
    max_bytes: 262144
    diurnal: false
    recommended:
    - svg
    description: 按钮图标、头像；用 mask 时实际取形状，颜色仍由 token 决定。
  font:
    media:
    - woff2
    - woff
    - ttf
    - otf
    max_bytes: 5242880
    diurnal: false
    families_max: 4
    description: '字体文件通过 @font-face 注册；配合 values.yaml 的 scripts 表生成 unicode-range，

      可实现同一段里英文/中文各用各的字体（第 1 条需求）。

      '
  video:
    media:
    - mp4
    - webm
    max_bytes: 67108864
    diurnal: true
    codecs:
    - h264
    - vp9
    muted_required: true
    autoplay: true
    loop: true
    poster: optional
    reduced_motion: static_poster
    description: '视频不能当 CSS 背景，必须由 primitives.yaml 的 insert-media-layer 插入 <video>。

      体积/分辨率建议：1080p、≤30 s、≤32 MiB；导出前压缩。

      '
probes:
  api: 3
  primitives:
    selector_exists:
      label: 锚点存在
      kind: dom
      eval: selector_match
      args:
      - anchor
      description: 在当前页面里能否匹配到锚点；匹配不到则该锚点相关写入降级。
    token_live:
      label: token 活着
      kind: host
      eval: token_status_live
      args:
      - name
      description: 该宿主 token 有消费方（status=live），写它才会生效。作为 realization 守卫时 `args.name` 可省略：省略即逐写绑定该 realization 内 token 写各自的 token 名；显式给出时必须与写入名一致。
    token_declared:
      label: token 已声明
      kind: host
      eval: token_declared
      args:
      - name
      description: 该 token 在宿主样式里声明过（哪怕没有消费方）；用于区分「拼错」与「死名」。
  profiles:
    live:
      description: 真实页面，用真实 DOM 与计算样式
    preview:
      description: 预览区，构造近似 DOM，允许部分原语返回 unknown
    fixture:
      description: 测试夹具，结果必须确定，用于 CI
  results:
    supported:
      description: 探测通过，可以写入
    unsupported:
      description: 探测失败，走下一档降级效果
    unknown:
      description: 预览环境无法判定，按 supported 处理但标「未验证」
