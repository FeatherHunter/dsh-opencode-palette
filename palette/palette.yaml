# palette.yaml —— DSH 全量主题能力表（P5 定稿，机器生成部分见 direct_bindings）
# 生成器：scripts/research/gen_palette_v5.py
# 结构：capabilities = 能力菜单（语义能力 + token 能力 + DOM 效果）；direct_bindings = 425 个 token 的直绑定兜底。
# 手写源：palette/palette.src.yaml（改能力改那里）；本文件不要手改。
# 每条能力都指向底层实现技术（token / 规则 / DOM），裸 token 名只出现在 binds / token 字段里。

api: 3
palette_version: 3.0.0
title: DSH 全量主题能力表
description: '插件的唯一能力真源。用户主题只能写这里登记过的能力 id；

  宿主改名时，只改 tokens.yaml / anchors.yaml，本文件不动。

  '
control_templates:
  button:
    properties:
    - icon
    - background
    - foreground
    - border_color
    - radius
    - opacity
    - shadow
  item:
    properties:
    - background
    - foreground
    - border_color
    - radius
  text:
    properties:
    - foreground
    - font_family
    - font_size
    - line_height
    - font_weight
  surface:
    properties:
    - background
    - border_color
    - radius
    - shadow
capabilities:
  global.page.background:
    kind: property
    since: 3.0.0
    tier: stable
    tags:
    - surface
    - global
    - media
    value: media
    docs: '页面整体背景。纯色走宿主 token；渐变/图画成规则；视频插媒体层。

      第 8–11 条需求的通用实现：区域背景（静态图 / 动态图 / 视频）。

      '
    examples:
    - value:
        light: '#f7f3ea'
        dark: '#12100c'
    - value: 'linear-gradient(180deg, #fdf6e3, #f5e6c8)'
    - value: assets/bg.jpg
    - value: assets/bg.mp4
    realization:
    - id: prefer-token
      accepts: color
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-alias-bg-base
    - id: css-paint
      accepts: paint
      writes:
      - id: bg
        use: rule
        anchor: global.root
        layer: base
        decl:
          background: $value
          background-size: cover
          background-position: center
    - id: media-layer
      accepts: video
      writes:
      - id: media
        use: dom
        anchor: global.root
        op: insert-media-layer
        payload: $value
        params:
          position: fixed
          inset: '0'
          z: -1
          fit: cover
          loop: true
          muted: true
          autoplay: true
          reduced_motion: static_poster
          pointer_events: none
        teardown: remove-node
        guard: observer
    meta:
      evidence:
      - packages/client/ui-theme/src/client/index.ts:369-378
    exposure: 默认开放
    source: hand-authored
    binds:
    - token: --dsw-alias-bg-base
    status: live
    tech:
    - token:--dsw-alias-bg-base
    merged_from:
    - global.page.background
  global.text.foreground:
    kind: property
    since: 3.0.0
    tier: stable
