capabilities:
  global.page.background:
    kind: property
    since: 3.0.0
    tier: stable
    tags:
    - surface
    - global
    - media
    value: media
    docs: '页面整体背景。纯色走宿主 token；渐变/图画成规则；视频插媒体层。

      第 8–11 条需求的通用实现：区域背景（静态图 / 动态图 / 视频）。

      '
    examples:
    - value:
        light: '#f7f3ea'
        dark: '#12100c'
    - value: 'linear-gradient(180deg, #fdf6e3, #f5e6c8)'
    - value: assets/bg.jpg
    - value: assets/bg.mp4
    realization:
    - id: prefer-token
      accepts: color
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-alias-bg-base
    - id: css-paint
      accepts: paint
      writes:
      - id: bg
        use: rule
        anchor: global.root
        layer: base
        decl:
          background: $value
          background-size: cover
          background-position: center
    - id: media-layer
      accepts: video
      writes:
      - id: media
        use: dom
        anchor: global.root
        op: insert-media-layer
        payload: $value
        params:
          position: fixed
          inset: '0'
          z: -1
          fit: cover
          loop: true
          muted: true
          autoplay: true
          reduced_motion: static_poster
          pointer_events: none
        teardown: remove-node
        guard: observer
    meta:
      evidence:
      - packages/client/ui-theme/src/client/index.ts:369-378
    exposure: 默认开放
    source: hand-authored
    binds:
    - token: --dsw-alias-bg-base
    status: live
    tech:
    - token:--dsw-alias-bg-base
    merged_from:
    - global.page.background
  global.text.foreground:
    kind: property
    since: 3.0.0
    tier: stable
    tags:
    - text
    - global
    value: color
    realization:
    - id: token
      writes:
      - id: token
        use: token
        name: --dsw-alias-label-primary
    exposure: 默认开放
    source: hand-authored
    merged_from:
    - global.text.primary
  global.text.font_family:
    kind: property
    since: 3.0.0
    tier: advanced
    tags:
    - typography
    - font
    value: typeface
    docs: '第 1 条需求：英文用英文字体、中文用中文字体。给 font_set（书写系统 → 字体）

      时自动生成 @font-face + unicode-range，同一段混排也能逐字分派；

      给字体栈则整体应用。

      '
    examples:
    - value: '"LXGW WenKai", "Noto Sans SC", sans-serif'
    - value:
        latin: assets/Font-Latin.woff2
        han: assets/Font-CJK.woff2
    realization:
    - id: token-stack
      accepts: font_stack
      when:
        probe: token_live
      writes:
      - id: token
        use: token
        name: --dsw-font-family
        value_template: $value
    - id: font-set-faces
      accepts: font_set
      atomic: true
      repeat:
        over: $value
        as: entry
      writes:
      - id: face-$entry.key
        use: rule
        at: '@font-face'
        layer: base
        decl:
          font-family: Palette-$entry.key
          src: url($entry.value) format("woff2")
          unicode-range: $entry.range
      - id: apply
        use: rule
        anchor: global.root
        layer: base
        decl:
          font-family: $family_stack
    exposure: 默认开放
    source: hand-authored
    merged_from:
    - typography.family.default
