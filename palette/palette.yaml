  terminal.panel.background:
    kind: property
    since: 3.0.0
    tier: basic
    tags: [terminal, surface]
    value: paint
    realization:
      - id: rule
        writes:
          - { id: bg, use: rule, anchor: terminal.root, layer: component, decl: { background: '$value' }, important: when_inline_conflict }

  deliverable.card.background:
    kind: property
    since: 3.0.0
    tier: advanced
    tags: [deliverable, card]
    value: paint
    realization:
      - id: rule
        writes:
          - { id: bg, use: rule, anchor: deliverable.card, layer: component, decl: { background: '$value' } }
    meta:
      confidence: fragile

  # —— 全局伪元素（滚动条 / 选区）——
  global.scrollbar.background:
    kind: property
    since: 3.0.0
    tier: advanced
    tags: [scrollbar]
    value: paint
    realization:
      - id: rule
        writes:
          - { id: thumb, use: rule, anchor: scrollbar.root, layer: component, decl: { 'scrollbar-color': '$value' } }

  global.selection.background:
    kind: property
    since: 3.0.0
    tier: advanced
