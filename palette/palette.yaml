# palette.yaml —— DSH 全量主题能力表（合成视图，P5 定稿）
# 本文件由 scripts/research/gen_palette_v5.py 从以下底层模块合成，不要手改：
#   capabilities.yaml / vocabulary.yaml / values.yaml / primitives.yaml / assets.yaml / probes.yaml / anchors.yaml / tokens.yaml
# 各段是底层模块的合成视图；capabilities 是能力菜单；direct_bindings 是 425 个 token 的直绑定兜底；runtime_summary 是运行时登记摘要。
# 每条能力都指向底层实现技术（token / 规则 / DOM / 字体 / 资源），裸 token 名只出现在 binds / token 字段里。

api: 3
palette_version: 3.0.0
title: DSH 全量主题能力表
description: '插件的唯一能力真源。用户主题只能写这里登记过的能力 id；

  宿主改名时，只改 tokens.yaml / anchors.yaml，本文件不动。

  '
generated:
  from:
  - capabilities.yaml
  - vocabulary.yaml
  - values.yaml
  - primitives.yaml
  - assets.yaml
  - probes.yaml
  - anchors.yaml
  - tokens.yaml
  generator: scripts/research/gen_palette_v5.py
  host:
    version: 0.2.1-rc.3
    commit: 1f81c047fc48fa190a683e469daa699857e9afe8
    theme_surface_note: rc.3 与 rc.2 的 ui-theme styles SHA256 全同、0 增删声明 → token 表不变
    source: D:\Temp\dsh-src
    path_base: 仓库根相对路径（packages/… 或 apps/…，可带 :行号）
    scan_script: scripts/research/gen_token_registry.py
  note: palette.yaml 由底层模块合成；改模块后重跑本脚本，不要手改本文件。
grammar:
  property_id: <region>.<role>.<property>
  recipe_id: <region>.<recipe>
  recipe_role_id: <region>.<role>.<recipe>
  expanded_property_id: <region>.<control_name>.<property>
  expanded_dedupe: 展开 id 与手写 id 相同时，手写优先，展开条目不另计
  control_name_source: anchors.yaml controls 的键：<region>.<controlName>（如 composer.sendButton）
  custom_prefix: custom
  vocabulary_bound: true
  locked: true
  capability_id: <domain>.<segment>(.<segment>){1,5}
  capability_id_pattern: ^[a-z][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+){1,8}$
  capability_domains_ref: capability_domains
  direct_binding_prefix: token
