api: 3
grammar:
  property_id: <region>.<role>.<property>
  recipe_id: <region>.<recipe>
  recipe_role_id: <region>.<role>.<recipe>
  expanded_property_id: <region>.<control_name>.<property>
  expanded_dedupe: 展开 id 与手写 id 相同时，手写优先，展开条目不另计
  control_name_source: anchors.yaml controls 的键：<region>.<controlName>（如 composer.sendButton）
  custom_prefix: custom
  vocabulary_bound: true
  locked: true
  capability_id: <domain>.<segment>(.<segment>){1,5}
  capability_id_pattern: ^[a-z][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+){1,8}$
  capability_domains_ref: capability_domains
  direct_binding_prefix: token
capability_domains:
- id: global
  label: 全局
- id: window
  label: 窗口外壳
- id: sidebar
  label: 侧栏
- id: conversation
  label: 对话区
- id: composer
  label: 输入区
- id: detail
  label: 详情面板
- id: settings
  label: 设置页
- id: menu
  label: 菜单/弹窗
- id: code
  label: 代码
- id: markdown
  label: Markdown
- id: tool
  label: 工具调用
- id: terminal
  label: 终端
- id: deliverable
  label: 交付物
- id: plugin
  label: 插件页
- id: content
  label: 内容（代码/Markdown/搜索等正文区域）
- id: control
  label: 控件（按钮/输入/图标等可换控件）
- id: status
  label: 状态色（成功/警告/错误/进行中）
- id: atom
  label: 调色板原子（底层原材料）
- id: specific
  label: 区域特化色（bubble/sidebar-fill 等）
- id: effect
  label: 视觉特效（阴影/材质/景深）
- id: onboarding
  label: 引导页
- id: overlay
  label: 蒙层/浮层
- id: document
  label: 文档预览
- id: decor
  label: 装饰（噪点/纹理/边框）
- id: tooltip
  label: 提示气泡
- id: toast
  label: 轻提示
- id: selection
  label: 选区/选中态
- id: entry
  label: 入口（官方 slot 按钮等）
- id: structure
  label: 结构改动（隐藏/移动/注入，实验）
- id: typography
  label: 排印（字族/字号/行高/字重）
- id: radius
  label: 圆角
- id: runtime
  label: 运行时布局量（--dsh 等内部变量，登记不开放）
- id: mask
  label: 蒙层/模糊
- id: token
  zh: 直绑定（裸 token 名）
  desc: 自动生成的 token 直绑定条目；id 形如 token.<namespace>.<名字>
