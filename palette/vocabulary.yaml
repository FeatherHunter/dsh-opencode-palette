states:
  hover: :hover
  active: :active
  focus: :focus-visible
  disabled: '[disabled], [aria-disabled="true"]'
  selected: '[aria-selected="true"]'
languages:
  selector: :lang({tag})
  tags:
  - zh-CN
  - zh-TW
  - en
  - ja
  - ko
  - fr
  - de
  - es
  - pt
  - it
  - ru
  - ar
  - vi
  - th
  - hi
catalog:
  order:
  - global
  - window
  - sidebar
  - conversation
  - composer
  - menu
  - code
  - markdown
  - tool
  - terminal
  - deliverable
  - settings
  - plugin
  - detail
  groups:
  - id: quickstart
    label: 快速上手
    members:
    - global.page.background
    - global.text.foreground
    - global.link.foreground
    - sidebar.panel.background
  - id: effects
    label: 视觉效果
    members:
    - '*.glass'
    - '*.wallpaper'
    - '*.noise'
  - id: chrome
    label: 窗口外壳
    members:
    - window.*
  - id: control
    label: 控件
    members:
    - button.*
