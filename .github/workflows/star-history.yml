name: Star History
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
# 防重叠：上一次还没跑完就别再起一个（源仓那批每日任务排队排了两小时）
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 第三方步骤统一固定到提交哈希：井号后面的版本只给人看，实际跑的是前面的哈希。标签会被覆盖，哈希不会。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node ≥ 22.18：仓库里的 .ts 脚本靠原生类型剥离直跑（engines 门槛同样是 >=22.18.0）
          node-version: 22.18
      - name: Fetch star history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 拉取失败不要再用 || true 吞掉：残缺数据会把曲线画成掉头的样子，
          # 宁可让这一步红。总量变小由 update-star-history.ts 负责拒绝写盘。
          gh api -H "Accept: application/vnd.github.star+json" "repos/FeatherHunter/dsh-opencode-palette/stargazers?per_page=100" --paginate --jq ".[].starred_at" > /tmp/stars.txt
          if [ ! -s /tmp/stars.txt ]; then echo "No stars fetched"; exit 0; fi
          node scripts/update-star-history.ts /tmp/stars.txt
      # 星图缓存戳（?v=）与文案现在都归 base 包渲染：数据/图更新后跑 readme:sync 重画托管块。
      # 不用 --repo .：package/README.md 是构建产物（.gitignore 忽略、CI 检出没有），
      # --repo . 会报 README not found 直接退出 1；这里只同步两个会入库的 README。
      - name: Sync managed README blocks
        run: |
          set -e
          npx -y dsh-featherhunter-plugin-base@0.0.2 readme:sync --readme README.md --self palette
          npx -y dsh-featherhunter-plugin-base@0.0.2 readme:sync --readme docs/README.en.md --self palette
      - name: Commit if changed
        run: |
          if git diff --quiet README.md docs/README.en.md docs/star-history.json docs/star-history.svg; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.en.md docs/star-history.json docs/star-history.svg
          git commit -m "每日更新 Star History：拉取星标数据并重绘手绘曲线图"
          # 别裸 push：任务跑得久，期间远端可能又前进了（源仓那批每日任务就是这么全红的）。
          # 先 fetch + merge，冲突重试三次；三次还不成就今天先不更新（不报错，下次补上）。
          for i in 1 2 3; do
            git fetch origin main
            if git merge --no-edit origin/main; then
              echo "merged origin/main (attempt $i)"
              break
            fi
            echo "merge 冲突，第 $i 次重试"
            git merge --abort || true
            if [ "$i" = "3" ]; then
              echo "今天先不更新，下次补上"
              exit 0
            fi
            sleep 5
          done
          git push origin HEAD:main
