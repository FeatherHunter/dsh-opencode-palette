<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1644" viewBox="0 0 1290 1644">\n<rect width="100%" height="100%" fill="#0d0d0d"/>\n<text x="20" y="56" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="700" fill="#f0f0f0">34 themes and the stories behind their names</text>\n<text x="20" y="84" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="15" fill="#8b8b95">Every name has a story</text>\n<g><rect x="20" y="110" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="36" y="128" width="52" height="40" rx="9" fill="#0F0F0F"/><circle cx="50" cy="148" r="6" fill="#A277FF"/><text x="104" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#A277FF">aura</text><text x="104" y="166" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">Purple neon aura</text></g><g><rect x="652" y="110" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="668" y="128" width="52" height="40" rx="9" fill="#0B0E14"/><circle cx="682" cy="148" r="6" fill="#59C2FF"/><text x="736" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#59C2FF">ayu</text><text x="736" y="166" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">Japanese for “sweetfish” — warm orange</text></g><g><rect x="20" y="200" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="36" y="218" width="52" height="40" rx="9" fill="#161616"/><circle cx="50" cy="238" r="6" fill="#33B1FF"/><text x="104" y="231" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#33B1FF">carbonfox</text><text x="104" y=