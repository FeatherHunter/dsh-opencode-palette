stem,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">The glowing green of digital rain</text></g><g><rect x="652" y="830" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="668" y="848" width="52" height="40" rx="9" fill="#171721"/><circle cx="682" cy="868" r="6" fill="#8DA4F5"/><text x="736" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#8DA4F5">mercury</text><text x="736" y="886" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">Lavender violet (opencode original)</text></g><g><rect x="20" y="920" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="36" y="938" width="52" height="40" rx="9" fill="#272822"/><circle cx="50" cy="958" r="6" fill="#66D9EF"/><text x="104" y="951" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#66D9EF">monokai</text><text x="104" y="976" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">The classic yellow-and-pink from Sublime Text</text></g><g><rect x="652" y="920" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="668" y="938" width="52" height="40" rx="9" fill="#011627"/><circle cx="682" cy="958" r="6" fill="#82AAFF"/><text x="736" y="951" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#82AAFF">nightowl</text><text x="736" y="976" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13.5" fill="#a1a1aa">Late-night coding blues and violets</text></g><g><rect x="20" y="1010" width="618" height="76" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="36" y="1028" width="52" height="40" rx="9" f