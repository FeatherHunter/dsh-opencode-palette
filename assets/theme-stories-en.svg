<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1292" viewBox="0 0 1288 1292">\n<rect width="100%" height="100%" fill="#0d0d0d"/>\n<text x="20" y="48" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">34 themes and the stories behind their names</text>\n<text x="20" y="72" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#8b8b95">Every name has a story</text>\n<g><rect x="20" y="96" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="108" width="46" height="34" rx="8" fill="#0F0F0F"/><circle cx="48" cy="125" r="5" fill="#A277FF"/><text x="94" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">aura</text><text x="94" y="139" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Purple neon aura</text></g><g><rect x="650" y="96" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="108" width="46" height="34" rx="8" fill="#0B0E14"/><circle cx="678" cy="125" r="5" fill="#59C2FF"/><text x="724" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">ayu</text><text x="724" y="139" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Japanese for “sweetfish” — warm orange</text></g><g><rect x="20" y="166" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="178" width="46" height="34" rx="8" fill="#161616"/><circle cx="48" cy="195" r="5" fill="#33B1FF"/><text x="94" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">carbonfox</text><text x="94" y="209" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">From the Nightfox family, built on IBM Carbon</text></g><g><rect x="650" y="166" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="178" width="46" height="34" rx="8" fill="#1E1E2E"/><circle cx="678" cy="195" r="5" fill="#89B4FA"/><text x="724" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">catppuccin</text><text x="724" y="209" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Latte-soft pastels (Mocha / Frappé / Macchiato)</text></g><g><rect x="20" y="236" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="248" width="46" height="34" rx="8" fill="#303446"/><circle cx="48" cy="265" r="5" fill="#8DA4E2"/><text x="94" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">catppuccin-frappe</text><text x="94" y="279" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The lighter, cooler sibling of Catppuccin</text></g><g><rect x="650" y="236" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="248" width="46" height="34" rx="8" fill="#24273A"/><circle cx="678" cy="265" r="5" fill="#8AADF4"/><text x="724" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">catppuccin-macchiato</text><text x="724" y="279" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The deeper, richer sibling of Catppuccin</text></g><g><rect x="20" y="306" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="318" width="46" height="34" rx="8" fill="#193549"/><circle cx="48" cy="335" r="5" fill="#0088FF"/><text x="94" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">cobalt2</text><text x="94" y="349" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The blue of the element cobalt (by Wes Bos)</text></g><g><rect x="650" y="306" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="318" width="46" height="34" rx="8" fill="#181818"/><circle cx="678" cy="335" r="5" fill="#88C0D0"/><text x="724" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">cursor</text><text x="724" y="349" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The official palette of the Cursor editor</text></g><g><rect x="20" y="376" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="388" width="46" height="34" rx="8" fill="#282A36"/><circle cx="48" cy="405" r="5" fill="#BD93F9"/><text x="94" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">dracula</text><text x="94" y="419" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The classic vampire-purple, a community icon</text></g><g><rect x="650" y="376" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="388" width="46" height="34" rx="8" fill="#2D353B"/><circle cx="678" cy="405" r="5" fill="#A7C080"/><text x="724" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">everforest</text><text x="724" y="419" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Forest-green tones, easy on the eyes</text></g><g><rect x="20" y="446" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="458" width="46" height="34" rx="8" fill="#100F0F"/><circle cx="48" cy="475" r="5" fill="#DA702C"/><text x="94" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">flexoki</text><text x="94" y="489" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Ink on warm paper (by kepano)</text></g><g><rect x="650" y="446" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="458" width="46" height="34" rx="8" fill="#0D1117"/><circle cx="678" cy="475" r="5" fill="#58A6FF"/><text x="724" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">github</text><text x="724" y="489" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">GitHub’s official palette</text></g><g><rect x="20" y="516" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="528" width="46" height="34" rx="8" fill="#282828"/><circle cx="48" cy="545" r="5" fill="#83A598"/><text x="94" y="540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">gruvbox</text><text x="94" y="559" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Retro warm tones honoring 80s CRTs and synths</text></g><g><rect x="650" y="516" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="528" width="46" height="34" rx="8" fill="#1F1F28"/><circle cx="678" cy="545" r="5" fill="#7E9CD8"/><text x="724" y="540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">kanagawa</text><text x="724" y="559" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Named after the ukiyo-e print 「The Great Wave off Kanagawa」</text></g><g><rect x="20" y="586" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="598" width="46" height="34" rx="8" fill="#1c1c1e"/><circle cx="48" cy="615" r="5" fill="#EC5B2B"/><text x="94" y="610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">lucent-orng</text><text x="94" y="629" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Vivid orange on a transparent base</text></g><g><rect x="650" y="586" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="598" width="46" height="34" rx="8" fill="#263238"/><circle cx="678" cy="615" r="5" fill="#82AAFF"/><text x="724" y="610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">material</text><text x="724" y="629" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The blue-grays of Google Material Design</text></g><g><rect x="20" y="656" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="668" width="46" height="34" rx="8" fill="#0A0E0A"/><circle cx="48" cy="685" r="5" fill="#2EFF6A"/><text x="94" y="680" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">matrix</text><text x="94" y="699" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The glowing green of digital rain</text></g><g><rect x="650" y="656" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="668" width="46" height="34" rx="8" fill="#171721"/><circle cx="678" cy="685" r="5" fill="#8DA4F5"/><text x="724" y="680" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">mercury</text><text x="724" y="699" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Lavender violet (opencode original)</text></g><g><rect x="20" y="726" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="738" width="46" height="34" rx="8" fill="#272822"/><circle cx="48" cy="755" r="5" fill="#66D9EF"/><text x="94" y="750" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">monokai</text><text x="94" y="769" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The classic yellow-and-pink from Sublime Text</text></g><g><rect x="650" y="726" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="738" width="46" height="34" rx="8" fill="#011627"/><circle cx="678" cy="755" r="5" fill="#82AAFF"/><text x="724" y="750" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">nightowl</text><text x="724" y="769" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Late-night coding blues and violets</text></g><g><rect x="20" y="796" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="808" width="46" height="34" rx="8" fill="#2E3440"/><circle cx="48" cy="825" r="5" fill="#88C0D0"/><text x="94" y="820" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">nord</text><text x="94" y="839" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The cool blue-grays of the Nordic arctic</text></g><g><rect x="650" y="796" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="808" width="46" height="34" rx="8" fill="#282C34"/><circle cx="678" cy="825" r="5" fill="#61AFEF"/><text x="724" y="820" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">one-dark</text><text x="724" y="839" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The classic dark theme from Atom editor</text></g><g><rect x="20" y="866" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="878" width="46" height="34" rx="8" fill="#0A0A0A"/><circle cx="48" cy="895" r="5" fill="#FAB283"/><text x="94" y="890" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">opencode</text><text x="94" y="909" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The official default theme — deep black with orange / blue / violet</text></g><g><rect x="650" y="866" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="878" width="46" height="34" rx="8" fill="#0A0A0A"/><circle cx="678" cy="895" r="5" fill="#EC5B2B"/><text x="724" y="890" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">orng</text><text x="724" y="909" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Straightforward, vivid orange</text></g><g><rect x="20" y="936" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="948" width="46" height="34" rx="8" fill="#111C18"/><circle cx="48" cy="965" r="5" fill="#2DD5B7"/><text x="94" y="960" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">osaka-jade</text><text x="94" y="979" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Jade green, Japanese-style (opencode original)</text></g><g><rect x="650" y="936" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="948" width="46" height="34" rx="8" fill="#292D3E"/><circle cx="678" cy="965" r="5" fill="#82AAFF"/><text x="724" y="960" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">palenight</text><text x="724" y="979" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Material’s deep purple-blue variant</text></g><g><rect x="20" y="1006" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="1018" width="46" height="34" rx="8" fill="#191724"/><circle cx="48" cy="1035" r="5" fill="#9CCFD8"/><text x="94" y="1030" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">rosepine</text><text x="94" y="1049" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95"></text></g><g><rect x="650" y="1006" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="1018" width="46" height="34" rx="8" fill="#002B36"/><circle cx="678" cy="1035" r="5" fill="#268BD2"/><text x="724" y="1030" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">solarized</text><text x="724" y="1049" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Sun-spectrum colors designed precisely around CIELAB</text></g><g><rect x="20" y="1076" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="1088" width="46" height="34" rx="8" fill="#262335"/><circle cx="48" cy="1105" r="5" fill="#36F9F6"/><text x="94" y="1100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">synthwave84</text><text x="94" y="1119" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">80s synthwave neon pink and cyan</text></g><g><rect x="650" y="1076" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="1088" width="46" height="34" rx="8" fill="#1c1c1e"/><circle cx="678" cy="1105" r="5" fill="transparent"/><text x="724" y="1100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">system</text><text x="724" y="1119" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">One click back to DSH’s default look</text></g><g><rect x="20" y="1146" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="1158" width="46" height="34" rx="8" fill="#1A1B26"/><circle cx="48" cy="1175" r="5" fill="#82AAFF"/><text x="94" y="1170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">tokyonight</text><text x="94" y="1189" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The deep blues and neon violets of Tokyo at night</text></g><g><rect x="650" y="1146" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="1158" width="46" height="34" rx="8" fill="#000000"/><circle cx="678" cy="1175" r="5" fill="#0070F3"/><text x="724" y="1170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">vercel</text><text x="724" y="1189" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Vercel’s brand blue</text></g><g><rect x="20" y="1216" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="34" y="1228" width="46" height="34" rx="8" fill="#101010"/><circle cx="48" cy="1245" r="5" fill="#FFC799"/><text x="94" y="1240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">vesper</text><text x="94" y="1259" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">Warm champagne orange (opencode original)</text></g><g><rect x="650" y="1216" width="618" height="58" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/><rect x="664" y="1228" width="46" height="34" rx="8" fill="#3F3F3F"/><circle cx="678" cy="1245" r="5" fill="#8CD0D3"/><text x="724" y="1240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#e2e2e8">zenburn</text><text x="724" y="1259" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#8b8b95">The classic low-contrast Vim theme</text></g>\n</svg>